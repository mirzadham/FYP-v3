version: '3.1'
responses:
  utter_ask_continue_conversation:
  - text: Is there anything else I can help you with?
    metadata:
      rephrase: true
  utter_ask_continue_interrupted_flow_confirmation:
  - text: Would you like to continue with {{context.interrupted_flow_options}}?
    metadata:
      rephrase: true
      template: jinja
  utter_ask_interrupted_flow_to_continue:
  - text: Would you like to resume {{context.interrupted_flow_options}}?
    metadata:
      rephrase: true
      template: jinja
  utter_ask_rephrase:
  - text: I’m sorry I am unable to understand you, could you please rephrase?
  utter_ask_still_there:
  - text: Hello, are you still there?
    metadata:
      rephrase: true
  utter_boolean_slot_rejection:
  - text: Sorry, the value you provided, `{{value}}`, is not valid. Please respond with a valid value.
    metadata:
      rephrase: true
      template: jinja
  utter_can_do_something_else:
  - text: What exactly can I help you with?
    metadata:
      rephrase: true
  utter_cannot_handle:
  - text: I'm sorry, I'm not trained to help with that.
  utter_categorical_slot_rejection:
  - text: Sorry, you responded with an invalid value - `{{value}}`. Please select one of the available options.
    metadata:
      rephrase: true
      template: jinja
  utter_clarification_no_options_rasa:
  - text: I can help, but I need more information. Please tell me a bit more about what you would like to do.
    metadata:
      rephrase: true
      template: jinja
  utter_clarification_options_rasa:
  - text: 'I can help, but I need more information. Which of these would you like to do: {{context.clarification_options}}?'
    metadata:
      rephrase: true
      template: jinja
  utter_closing_words:
  - text: Okay, I'll be around in case you need further help.
    metadata:
      rephrase: true
  utter_corrected_previous_input:
  - text: Ok, I am updating {{ context.corrected_slots.keys()|join(', ') }} to {{ context.new_slot_values | join(', ') }} respectively.
    metadata:
      rephrase: true
      template: jinja
  utter_float_slot_rejection:
  - text: Sorry, it seems the value you provided `{{value}}` is not a valid number. Please provide a valid number in your response.
    metadata:
      rephrase: true
      template: jinja
  utter_flow_cancelled_rasa:
  - text: Okay, stopping {{ context.canceled_name }}.
    metadata:
      rephrase: true
      template: jinja
  utter_free_chitchat_response:
  - text: Sorry, I'm not able to answer that right now.
    metadata:
      rephrase: true
      rephrase_prompt: |
        You are an incredibly friendly assistant. Generate a short
        response to the user's comment in simple english.

        User: {{current_input}}
        Response:
  utter_human_handoff_not_available:
  - text: I understand you want to be connected to a human agent, but that's something I cannot help you with at the moment. Is there something else I can help you with?
    metadata:
      rephrase: true
  utter_inform_code_change:
  - text: There has been an update to my code. I need to wrap up our running dialogue and start from scratch.
    metadata:
      rephrase: true
  utter_inform_hangup:
  - text: I haven’t heard from you, so I’ll end our conversation shortly.
    metadata:
      rephrase: true
  utter_internal_error_rasa:
  - text: Sorry, I am having trouble with that. Please try again in a few minutes.
  utter_no_knowledge_base:
  - text: I am afraid, I don't know the answer. At this point, I don't have access to a knowledge base.
    metadata:
      rephrase: true
  utter_no_relevant_answer_found:
  - text: I’m sorry, I can’t help with that.
    metadata:
      rephrase: true
  utter_skip_question_answer:
  - text: I'm here to provide you with the best assistance, and in order to do so, I kindly request that we complete this step together. Your input is essential for a seamless experience!
    metadata:
      rephrase: true
  utter_user_input_empty_error_rasa:
  - text: I see an empty message. What can I assist you with?
  utter_user_input_too_long_error_rasa:
  - text: I'm sorry, but your message is too long for me to process. Please keep your message concise and within {% if context.info.max_characters %}{{context.info.max_characters}} characters.{% else %}a reasonable length.{% endif %}
    metadata:
      template: jinja
  utter_deferment_info:
  - text: |
      📋 **Deferment (Leave of Absence)**

      **Procedure:**
      1. Get deferment form from Faculty
      2. Submit with supporting documents
      3. Obtain Dean's approval

      **Deadline:** Before Week 3 of semester
      **Duration:** Maximum 2 semesters

      ⚠️ May affect PTPTN/scholarships. Contact Student Affairs for details.
  utter_change_program:
  - text: |
      🔄 **Changing Program/Major**

      **Requirements:**
      • Minimum CGPA (usually 2.5+)
      • Completed at least 1 semester
      • Available slots in target program

      **Procedure:**
      1. Get application form from Registry
      2. Get approval from both faculties
      3. Submit before deadline

      💡 Credits may transfer depending on course equivalence.
  utter_repeat_policy:
  - text: |
      📚 **Repeat/Failed Subject Policy**

      **Key Points:**
      • Failed subjects must be repeated
      • Core subjects: Must repeat immediately when offered
      • Maximum grade after repeat: Usually capped (check faculty rules)

      **GPA Impact:**
      • Both grades may appear on transcript
      • Latest attempt used for CGPA calculation

      ⚠️ Repeated failures may lead to probation.
  utter_grade_appeal:
  - text: |
      📝 **Grade Appeal/Review**

      **Procedure:**
      1. Submit appeal form to Faculty
      2. Pay review fee (varies)
      3. Wait for recheck result

      **Deadline:** Usually 2 weeks after results release

      **Note:** Appeal may result in same, higher, or lower grade.

      💡 Consult your lecturer first before formal appeal.
  utter_probation_info:
  - text: |
      ⚠️ **Academic Probation**

      **Status Levels:**
      • **P1:** CGPA 1.50 - 1.99 (1st warning)
      • **P2:** Still below 2.00 after P1
      • **P3:** Still below 2.00 after P2
      • **Dismissed:** After P3 if CGPA still below 2.00

      **Requirements During Probation:**
      • Limited credit hours (usually max 15)
      • Must maintain minimum semester GPA

      💡 Seek help from academic advisor immediately!
  utter_credit_transfer:
  - text: |
      📋 **Credit Transfer/Exemption**

      **Eligible For:**
      • Diploma graduates
      • Transfer students from other universities

      **Procedure:**
      1. Submit exemption form with transcript
      2. Provide syllabus of previous courses
      3. Faculty evaluates equivalence

      **Limits:** Usually max 30% of program credits

      ⚠️ Apply within first semester of enrollment.
  utter_elective_options:
  - text: |
      📚 **Elective Courses**

      **Types:**
      • **Program Electives:** Within your field
      • **Faculty Electives:** Any course in faculty
      • **University Electives:** Any faculty (limited)

      **Popular Categories:**
      • Language courses (Japanese, Mandarin, etc.)
      • Entrepreneurship
      • Sports & Recreation

      💡 Check SMP for available electives each semester.
  utter_industrial_training:
  - text: |
      🏢 **Industrial Training (LI)**

      **Requirements:**
      • Usually in Year 3 or 4
      • Minimum credits completed (check program)
      • Must not be on probation

      **Duration:** 12-16 weeks (varies by program)

      **Procedure:**
      1. Attend LI briefing session
      2. Find and apply to companies
      3. Submit placement confirmation
      4. Complete LI report and logbook

      💡 Start searching for placement 6 months early!
  utter_thank_you:
  - text: |
      You're welcome! 😊 Happy to help.

      Feel free to ask if you have more questions about courses, registration, or academic procedures!
  - text: |
      No problem! 👍 Glad I could assist.

      Is there anything else you'd like to know?
  utter_help:
  - text: |
      🎓 **Here's how I can help you:**

      📚 **Course Information**
      • "Tell me about CCS3101" — Get course synopsis and credits
      • "What are the prerequisites for CSC4600?" — Check required courses

      📋 **Academic Procedures**
      • Registration deadlines and procedures
      • Dropping courses and deferment
      • Credit transfer and program changes

      🎯 **Other Topics**
      • Graduation requirements
      • Industrial training information
      • Exam schedules and regulations

      Just ask me anything about your academic journey!
  utter_hello:
  - text: |
      👋 Hello! I'm your **UPM Academic Advisor Chatbot**.

      I can help you with:
      • 📚 Course information and synopses
      • 📋 Prerequisites for courses
      • 📅 Registration deadlines and procedures
      • 🎓 Graduation requirements

      How can I assist you today?
  - text: |
      Hi there! 👋 Welcome to the UPM Academic Advisor.

      I'm here to help with course info, prerequisites, and academic procedures.

      What would you like to know?
  utter_goodbye:
  - text: |
      👋 Goodbye! Good luck with your studies.

      Feel free to come back if you have more questions about courses or registration!
  - text: |
      Take care! 📚 Don't hesitate to return if you need any academic guidance.

      Best of luck with your semester!
  utter_bot_identity:
  - text: |
      🤖 Yes, I'm an AI-powered academic advisor chatbot!

      I'm here to help UPM students with:
      • Course information and prerequisites
      • Registration and academic procedures
      • General academic guidance

      How can I assist you today?
  utter_convocation_info:
  - text: |
      🎓 **Convocation/Graduation Ceremony**

      **Registration:**
      • Done through SMP portal
      • Usually opens 2 months before ceremony

      **Requirements:**
      • Complete all graduation requirements
      • Clear all outstanding fees
      • Register within deadline

      **Attire:**
      • Rent graduation robe from appointed vendor
      • Follow dress code guidelines

      **Guest Tickets:**
      • Usually 2-4 tickets per graduate
      • Additional tickets may be available

      🎉 Congratulations on reaching this milestone!
  utter_career_prospects:
  - text: |
      💼 **Career Prospects (Computer Science)**

      **Popular Career Paths:**
      • Software Developer/Engineer
      • Data Scientist/Analyst
      • Cybersecurity Specialist
      • Web/Mobile Developer
      • Cloud/DevOps Engineer
      • AI/ML Engineer

      **Industries:**
      • Tech companies (Google, Microsoft, etc.)
      • Banking & Finance
      • E-commerce
      • Government agencies
      • Startups

      **Demand:** High - CS graduates are in demand globally!

      💡 Build projects and get certifications to stand out.
  utter_mental_health_support:
  - text: |
      💚 **We're Here For You**

      I'm sorry you're going through a difficult time. Your wellbeing matters.

      **Immediate Support:**
      📞 **Malaysia Mental Health Line:** 03-2935 9935
      📞 **Befrienders:** 03-7956 8145 (24 hours)

      **UPM Resources:**
      • **Counseling Services:** Pusat Kaunseling UPM
      • **Location:** Bangunan Hal Ehwal Pelajar
      • **Hours:** Mon-Fri, 8am-5pm

      **Remember:**
      • It's okay to ask for help
      • Taking a break is okay
      • You are not alone

      ❤️ Please reach out to someone - a friend, family, or counselor.
  utter_fees_block:
  - text: |
      💰 **Registration Block (Fees)**

      **Reasons for Block:**
      • Outstanding tuition fees
      • Payment not yet processed

      **To Unblock:**
      1. Pay minimum required amount
      2. Upload payment proof to SMP
      3. Wait 24-48 hours for system update

      💡 Contact Bursary if payment not reflected after 3 days.
  utter_class_full:
  - text: |
      📚 **Full Class/Section**

      **Options:**
      • Try other available sections
      • Check during add/drop period (seats may open)
      • Request quota increase from lecturer

      **Procedure for Quota Request:**
      1. Email lecturer with justification
      2. If approved, get signed form
      3. Submit to Faculty office

      ⚠️ No guarantee of approval - have backup subjects ready.
  utter_timetable_clash:
  - text: |
      📅 **Timetable Clash**

      **Solutions:**
      • Switch to different section of one subject
      • Drop one subject and take it next semester
      • Request special arrangement (rare)

      **Tips:**
      • Plan your registration early
      • Have backup sections ready
      • Check timetable before finalizing

      ⚠️ Attending both clashing classes is NOT allowed.
  utter_system_issues:
  - text: |
      🖥️ **System/Portal Issues**

      **Common Solutions:**
      • Clear browser cache
      • Try different browser (Chrome recommended)
      • Check if system is under maintenance

      **Password Reset:**
      • Use "Forgot Password" on login page
      • Contact IT Helpdesk if still unable

      📞 **IT Helpdesk:** Contact your faculty's IT support

      💡 Try during off-peak hours (early morning/late night).
  utter_verification_letter:
  - text: |
      📄 **Student Verification Letter**

      **Types Available:**
      • Enrollment confirmation
      • Active student status
      • For PTPTN/scholarship/bank

      **How to Get:**
      1. Login to SMP portal
      2. Go to "Surat Pengesahan" section
      3. Download and print

      **For Custom Letters:**
      Contact Registry/Faculty office with specific requirements.
  utter_course_details:
  - text: |
      📚 **{course_code}**: {course_name}

      💳 **Credit Hours:** {credits}

      📋 **Prerequisites:** {prereq_list}

      📖 **Synopsis:**
      {synopsis}
  utter_exam_schedule:
  - text: |
      📅 **Exam Schedule**

      **How to Check:**
      1. Login to SMP portal
      2. Go to "Jadual Peperiksaan"
      3. View your personalized exam timetable

      **Includes:**
      • Date and time
      • Venue/Hall
      • Seat number

      ⚠️ Timetable usually released 2-3 weeks before exams.
  utter_exam_regulations:
  - text: |
      📋 **Exam Regulations**

      **Dress Code:**
      • Formal/smart casual attire
      • No slippers, shorts, or sleeveless

      **Must Bring:**
      • Student ID card (matric card)
      • Stationery (pens, pencils)
      • Calculator (if permitted)

      **NOT Allowed:**
      • Mobile phones (must be OFF and stored)
      • Notes/books (unless open book exam)

      ⚠️ Arrive 30 mins early. Late entry may be denied.
  utter_deans_list:
  - text: |
      🏆 **Dean's List (Anugerah Dekan)**

      **Requirements:**
      • Semester GPA: 3.50 or above
      • No failed subjects that semester
      • Minimum credit hours (usually 12+)

      **Benefits:**
      • Certificate from Dean
      • Recognition in academic records
      • Some faculties offer monetary rewards

      💡 Aim high every semester - it looks great on your resume!
  utter_muet_requirement:
  - text: |
      📝 **MUET Requirement**

      **Minimum Band for Graduation:**
      • Most programs: Band 3
      • Some programs: Band 4 (check with faculty)

      **If Below Requirement:**
      • Must retake MUET before graduation
      • Register through Malaysian Examination Council

      **Alternatives (Some Programs):**
      • IELTS (minimum score varies)
      • TOEFL (check equivalency)

      💡 Take MUET early so you have time to retake if needed!
  utter_ask_course_code:
  - text: Which course would you like to check prerequisites for? Please provide the course code (e.g., CCS3101, CSC4600).
    metadata:
      rephrase: true
  utter_prereq_result:
  - text: |
      📚 **{course_code}** ({course_name})

      📋 **Prerequisites:**
      {prereq_list}

      Make sure you have completed these courses before enrolling!
  utter_no_prerequisites:
  - text: |
      📚 **{course_code}** ({course_name})

      ✅ **No prerequisites required!**

      You can enroll in this course directly.
  utter_course_not_found:
  - text: |
      ❌ Sorry, I couldn't find course **{course_code}** in the database.

      Please check the course code and try again. Example: CCS3101, CSC4600
  utter_registration_deadline:
  - text: |
      📅 **Course Registration Deadlines**

      **Add/Drop Period:** Usually Week 1-2 of semester

      **Important Notes:**
      • Check SMP portal for exact dates each semester
      • Late registration may incur penalties
      • Ensure fees are paid to avoid registration block

      💡 Visit the Academic Calendar on UPM website for current dates.
  utter_drop_course:
  - text: |
      📋 **Dropping/Withdrawing from a Course**

      **Procedure:**
      1. Apply through SMP portal
      2. Get advisor's approval
      3. Submit before deadline

      **Types of Withdrawal:**
      • **Week 1-2:** Full refund, no record
      • **Week 3-7:** Partial refund, "W" grade
      • **After Week 7:** No refund, may affect GPA

      ⚠️ Dropping courses may affect PTPTN/scholarship eligibility.
  utter_graduation_requirements:
  - text: |
      🎓 **Graduation Requirements**

      **Credit Hours:** 120-130 credits (varies by program)

      **Minimum CGPA:** 2.00

      **Required Components:**
      • Complete all core subjects
      • Complete electives requirement
      • Pass Final Year Project (FYP)
      • Meet MUET Band requirement
      • Complete Industrial Training (LI)

      💡 Check with your faculty for program-specific requirements.

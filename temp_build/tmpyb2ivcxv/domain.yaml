slots:
  language:
    type: strict_categorical
    initial_value: en
    values:
    - en
    mappings: []
    is_builtin: true
  confirm_correction:
    type: bool
    mappings:
    - type: from_llm
  silence_timeout:
    type: float
    initial_value: 7.0
    max_value: 1000000
  consecutive_silence_timeouts:
    type: float
    initial_value: 0.0
    max_value: 1000000
  interrupted_flow_to_continue:
    type: text
    mappings:
    - type: from_llm
  continue_interrupted_flow_confirmation:
    type: bool
    mappings:
    - type: from_llm
  max_clarification_options:
    type: float
    initial_value: 3.0
  continue_conversation:
    type: bool
    mappings:
    - type: from_llm
  return_value:
    type: text
    mappings:
    - type: controlled
  confirmation:
    type: bool
    mappings:
    - type: from_llm
  course_name:
    type: text
    mappings:
    - type: controlled
  credits:
    type: float
    mappings:
    - type: controlled
  synopsis:
    type: text
    mappings:
    - type: controlled
  course_code:
    type: text
    mappings:
    - type: from_llm
  prereq_list:
    type: text
    mappings:
    - type: controlled
  has_prerequisites:
    type: bool
    mappings:
    - type: controlled

        🎯 **Academic-Career Alignment**
        
        Your academic choices shape your career path. Here's how your coursework connects to industry:
        
        **Key Courses & Career Relevance:**
        • **Programming** → Software Development, App Development
        • **Data Structures & Algorithms** → Tech company interviews, efficient coding
        • **Database Systems** → Backend Development, Data Engineering
        • **AI/Machine Learning** → Data Science, AI Engineering
        • **Networks & Security** → Cybersecurity, Cloud Engineering
        
        **Academic Advice:**
        • Choose electives that align with your target career
        • Build projects to apply what you learn
        • Your FYP topic can be a portfolio piece
        
        📚 **For detailed career counseling** (resume, interviews, job search): Please visit the **Career Services Center**.
        
        💡 Focus on building skills through coursework and projects!

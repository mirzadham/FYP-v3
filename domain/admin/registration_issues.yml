version: "3.1"

slots:
  full_course_code:
    type: text
    mappings:
      - type: from_llm

  is_final_year:
    type: bool
    mappings:
      - type: from_llm

  clashing_courses:
    type: text
    mappings:
      - type: from_llm

  both_courses_required:
    type: bool
    mappings:
      - type: from_llm

actions:
  - action_assess_full_class_options
  - action_assess_clash_resolution

responses:
  utter_class_full_intro:
    - text: |
        📚 **Class Full - Let's Find Solutions**
        
        I can help you figure out your options when a class is full.
        
        Which course is full?

  utter_final_year_priority:
    - text: |
        🎓 **Final Year Priority**
        
        As a final-year student needing this course to graduate, you may have priority!
        
        **Special Option:** Request manual registration through your lecturer.

  utter_manual_registration_option:
    - text: |
        📋 **Manual Registration Process**
        
        1. Email the course lecturer explaining your situation
        2. Mention you're final year and need this to graduate
        3. Request manual registration approval
        4. If approved, Faculty will add you
        
        💡 Be polite and provide your matric number!

  utter_full_class_options:
    - text: |
        📚 **Options When Class is Full**
        
        1. **Check other sections** - Different time slot might have space
        2. **Wait for add/drop** - Students often drop in Week 1-2
        3. **Monitor SMP** - Seats open up randomly
        4. **Take next semester** - If not urgent

  utter_wait_strategy:
    - text: |
        ⏰ **Waiting Strategy**
        
        • Check SMP multiple times daily during Week 1
        • Seats open when others drop
        • Be ready to register immediately
        • Have a backup course ready

  utter_clash_intro:
    - text: |
        📅 **Timetable Clash Resolution**
        
        Let's sort out your schedule conflict!
        
        Which courses are clashing?

  utter_both_required_options:
    - text: |
        ⚠️ **Both Courses Required - Options**
        
        If both courses are required this semester:
        
        1. **Check for other sections** - Different timings
        2. **Request section change** - Talk to lecturer
        3. **Special arrangement** - For final-year students
        
        ⚠️ In rare cases, you may need to defer one course.

  utter_defer_one_option:
    - text: |
        💡 **Recommendation: Defer One Course**
        
        Since one course isn't urgently required:
        
        • Drop the less urgent course
        • Take it next semester when offered
        • Avoid overloading your schedule
        
        This is often the simplest solution!

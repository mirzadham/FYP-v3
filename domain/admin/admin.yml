version: "3.1"

responses:
  utter_class_full:
    - text: |
        📚 **Full Class/Section**
        
        **Academic Advice:**
        1. Check if other sections are available.
        2. Wait for the Add/Drop period (seats often open up).
        3. Consult the lecturer for a potential **Manual Registration** if critical for graduation.

  utter_timetable_clash:
    - text: |
        📅 **Timetable Clash**
        
        **Academic Advice:**
        • You typically cannot register for clashing classes.
        • Switch sections if possible.
        • If unavoidable, you may need to **drop one subject** and take it next semester.
        
        ⚠️ Plan your schedule carefully to avoid extending your study duration.

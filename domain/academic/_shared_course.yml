version: "3.1"

# Shared slots and responses used by multiple course-related flows
# (get_course_info, check_prerequisite, search_courses)

slots:
  course_code:
    type: text
    mappings:
      - type: from_llm

  course_code_valid:
    type: bool
    mappings:
      - type: controlled

  course_name:
    type: text
    mappings:
      - type: controlled

  credits:
    type: any
    mappings:
      - type: controlled

  synopsis:
    type: text
    mappings:
      - type: controlled

  prereq_list:
    type: text
    mappings:
      - type: controlled

  has_prerequisites:
    type: bool
    mappings:
      - type: controlled

responses:
  utter_invalid_course_code_format:
    - text: |
        ❌ Invalid Course Code Format
        
        The course code should follow the format: 3-4 letters + 4 digits
        
        Examples: `CCS3101`, `CSC4600`, `SKP2101`, `AKU3311`
        
        Please enter a valid course code.

  utter_course_not_found:
    - text: |
        ❌ Course Not Found
        
        I couldn't find information for {course_code} in my database.
        
        Possible reasons:
        • Course code might be incorrect
        • Course may not be in my faculty handbooks
        
        💡 Double-check the code in your SMP or faculty handbook.

  utter_database_error:
    - text: |
        ⚠️ System Error
        
        I encountered an issue while searching for course information.
        
        Please try again in a moment. If the problem persists, contact your Academic Advisor directly.

version: "3.1"

responses:
  utter_graduation_eligibility:
    - text: |
        🎓 **Graduation Eligibility Check**
        
        **Academic Requirements to Graduate:**
        
        1. **Credit Hours:**
           • Complete all required credit hours for your program
           • Verify in SMP → Academic → Transcript
        
        2. **Minimum CGPA:**
           • CGPA ≥ 2.00 (varies by program)
        
        3. **Course Completion:**
           • All core courses passed
           • Required electives fulfilled
           • FYP/Project completed (if applicable)
        
        4. **Language Requirement:**
           • MUET Band 3+ (or equivalent)
        
        ⚠️ **Note:** Ceremony logistics (robes, tickets, venue) are handled by the Registry. Please check SMP or the official Convocation website for those matters.
        
        💡 Check your transcript in SMP to verify your eligibility status!

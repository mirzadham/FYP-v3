version: "3.1"

responses:
  utter_exam_schedule:
    - text: |
        📅 **Exam Schedule**
        
        The official Final Examination Timetable is managed and released by the **Examination Unit** (Academic Division).
        
        👉 **Action Required:** Please check your personalized exam schedule via the **Student Management Portal (SMP)** or the official "Jadual Waktu Peperiksaan" release.
        
        [Check SMP Portal](https://smp.upm.edu.my)

  utter_exam_regulations:
    - text: |
        📋 **Exam Regulations**
        
        Detailed regulations regarding dress code, forbidden items, and conduct are enforced by the **Examination Unit**.
        
        Please refer to the **"Universiti Putra Malaysia (Examination) Rules"** handbook.
        
        ⚠️ **Note:** Strict dress code compliance is required for entry into the exam hall.

  utter_deans_list:
    - text: |
        🏆 **Dean's List (Anugerah Dekan)**
        
        **Requirements:**
        • Semester GPA: 3.50 or above
        • No failed subjects that semester
        • Minimum credit hours (usually 12+)
        
        **Benefits:**
        • Certificate from Dean
        • Recognition in academic records
        • Some faculties offer monetary rewards
        
        💡 Aim high every semester - it looks great on your resume!

  utter_muet_requirement:
    - text: |
        📝 **MUET Requirement**
        
        **Minimum Band for Graduation:**
        • Most programs: Band 3
        • Some programs: Band 4 (check with faculty)
        
        **If Below Requirement:**
        • Must retake MUET before graduation
        • Register through Malaysian Examination Council
        
        **Alternatives (Some Programs):**
        • IELTS (minimum score varies)
        • TOEFL (check equivalency)
        
        💡 Take MUET early so you have time to retake if needed!

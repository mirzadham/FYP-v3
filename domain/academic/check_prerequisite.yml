# check_prerequisite.yml - Prerequisite checking flow
# Shared slots and responses are in _shared_course.yml

actions:
  - check_prerequisites
  - reset_course_code
  - validate_course_code_format

slots:
  wants_another_check:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_course_code:
    - text: "Which course would you like to check prerequisites for? Please provide the course code (e.g., CCS3101, CSC4600)."
      metadata:
        rephrase: true

  utter_prereq_result:
    - text: |
        📚 {course_code} ({course_name})
        
        📋 Prerequisites:
        {prereq_list}
        
        Make sure you have completed these courses before enrolling!

  utter_prereq_guidance:
    - text: |
        💡 Tip: Check with your academic advisor about the best semester to complete any missing prerequisites.

  utter_no_prerequisites:
    - text: |
        📚 {course_code} ({course_name})
        
        ✅ No prerequisites required!
        
        You can enroll in this course directly.

  utter_ask_wants_another_check:
    - text: "Would you like me to check prerequisites for another course?"
      metadata:
        rephrase: true

  utter_goodbye_prerequisites:
    - text: "Happy to help! Good luck with your course planning. 😊"

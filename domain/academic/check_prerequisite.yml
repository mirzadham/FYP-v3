version: "3.1"

actions:
  - validate_course_code_format
  - check_prerequisites
  - reset_course_code

slots:
  course_code:
    type: text
    mappings:
      - type: from_llm

  course_code_valid:
    type: bool
    mappings:
      - type: controlled

  prereq_list:
    type: text
    mappings:
      - type: controlled

  has_prerequisites:
    type: bool
    mappings:
      - type: controlled

  wants_another_check:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_course_code:
    - text: "Which course would you like to check prerequisites for? Please provide the course code (e.g., CCS3101, CSC4600)."
      metadata:
        rephrase: true

  utter_prereq_result:
    - text: |
        📚 **{course_code}** ({course_name})
        
        📋 **Prerequisites:**
        {prereq_list}
        
        Make sure you have completed these courses before enrolling!

  utter_prereq_guidance:
    - text: |
        💡 **Tip**: Check with your academic advisor about the best semester to complete any missing prerequisites.

  utter_no_prerequisites:
    - text: |
        📚 **{course_code}** ({course_name})
        
        ✅ **No prerequisites required!**
        
        You can enroll in this course directly.

  utter_course_not_found:
    - text: |
        ❌ Sorry, I couldn't find course **{course_code}** in the database.
        
        Please check the course code and try again. Example: CCS3101, CSC4600

  utter_invalid_course_code_format:
    - text: |
        The course code format doesn't look right. 📝
        
        UPM course codes follow this pattern: **3 letters + 4 digits**
        
        ✅ Examples: CCS3101, SKS1002, CSC4600

  utter_database_error:
    - text: |
        I'm sorry, but I'm having trouble connecting to the academic database right now. 😔
        
        Please try again in a few minutes, or contact the academic office directly.

  utter_ask_wants_another_check:
    - text: "Would you like me to check prerequisites for another course?"
      metadata:
        rephrase: true

  utter_goodbye_prerequisites:
    - text: "Happy to help! Good luck with your course planning. 😊"

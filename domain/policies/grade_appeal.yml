  utter_grade_appeal_guidance:
    - text: |
        📝 **Grade Appeal Guidance**
        
        **When to Consider an Appeal:**
        • You believe there was an error in marking
        • Marks don't match your expected performance
        • Calculation errors suspected
        
        **Before Appealing (My Advice):**
        1. ✅ Review your exam script with the lecturer first
        2. ✅ Understand where you lost marks
        3. ✅ Consider if an appeal is warranted
        
        **Formal Appeal Process:**
        👉 Handled by the **Faculty Academic Office**
        • Submit appeal form + fee
        • Deadline: Usually 2 weeks after results
        • Result may be same, higher, or lower
        
        ⚠️ I can advise you on whether to appeal, but the formal process goes through the Faculty Academic Office.

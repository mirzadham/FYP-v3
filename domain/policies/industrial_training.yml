version: "3.1"

slots:
  wants_li_assessment:
    type: bool
    mappings:
      - type: from_llm

  current_year:
    type: float
    mappings:
      - type: from_llm

  year_valid:
    type: bool
    mappings:
      - type: custom

  is_on_probation:
    type: bool
    mappings:
      - type: from_llm

  li_eligible:
    type: bool
    mappings:
      - type: custom

  li_status:
    type: categorical
    # description moved to flow file for LLM context
    values:
      - eligible
      - not_yet
      - not_eligible
    mappings:
      - type: custom

  li_issues:
    type: text
    mappings:
      - type: custom

  wants_li_guidance:
    type: bool
    mappings:
      - type: from_llm

actions:
  - action_check_li_assessment_choice
  - action_validate_year
  - action_reset_year
  - action_assess_li_eligibility

responses:
  utter_ask_is_on_probation:
    - text: |
        📋 Are you currently on academic probation?
        
        This affects your eligibility for industrial training.

  utter_ask_wants_li_guidance:
    - text: |
        💡 Would you like additional guidance on preparing for industrial training?

  utter_ask_wants_li_assessment:
    - text: |
        🏢 Would you like me to check your industrial training eligibility?

  utter_ask_current_year:
    - text: |
        📅 What year of study are you currently in?
        
        Please enter **1**, **2**, **3**, or **4**.

  utter_ask_credits_completed:
    - text: |
        📊 How many credit hours have you completed so far?
        
        Please enter a number (e.g., `60` or `85`).

  utter_li_intro:
    - text: |
        🏢 **Industrial Training (LI) Eligibility Check**
        
        I can help verify if you're eligible for industrial training!
        
        **What I'll check:**
        ✅ Year of study (usually Year 3-4)
        ✅ Credit hours completed
        ✅ Academic standing (not on probation)
        
        **Note:** For placement, documentation, and logistics, contact your **LI Coordinator**.
        
        Ready to check your eligibility?
    - text: |
        🏭 **Industrial Training Eligibility**
        
        Let me help you check if you're ready for LI/internship!
        
        I'll verify:
        • Your year of study
        • Credits completed
        • Probation status
        
        Shall we proceed?

  utter_li_general_info:
    - text: |
        📋 **Industrial Training Overview**
        
        **Eligibility Requirements:**
        • Year 3 or Year 4 standing
        • Minimum credits completed (~70-80)
        • Not on academic probation
        • All prerequisite courses passed
        
        **Duration:** 12-16 weeks (varies by program)
        
        **Contact:** Your Faculty's LI Coordinator for placement and registration.
    - text: |
        🏢 **LI Quick Guide**
        
        **When:** Usually Year 3 or 4
        **Duration:** 3-4 months
        **Requirements:** Good academic standing, sufficient credits
        
        Your LI Coordinator handles all placements and paperwork!

  utter_invalid_year_format:
    - text: |
        ❌ I couldn't understand that year.
        
        Please enter your current year of study: **1**, **2**, **3**, or **4**.
    - text: |
        🔢 Please enter a valid year (1, 2, 3, or 4).

  utter_li_eligible:
    - text: |
        ✅ **You Appear Eligible for Industrial Training!**
        
        Based on your input:
        • Year: **{current_year}** ✅
        • Credits: **{credits_completed}** ✅
        • Probation: Not on probation ✅
        
        You seem to meet the academic eligibility requirements! 🎉
    - text: |
        🎉 **Great News - You're LI Ready!**
        
        **Eligibility Summary:**
        ✅ Year {current_year} - meets requirement
        ✅ {credits_completed} credits - sufficient
        ✅ Good academic standing
        
        Time to start your LI journey!

  utter_li_next_steps:
    - text: |
        📋 **Next Steps for Industrial Training**
        
        1. **Contact your LI Coordinator** - Get the latest LI briefing schedule
        2. **Attend LI Briefing** - Mandatory for all LI students
        3. **Search for placements** - Start 6 months early!
        4. **Submit company acceptance letter** - To your faculty
        5. **Prepare required documents** - Resume, cover letter, etc.
        
        🏢 **Your LI Coordinator handles:**
        • Placement verification
        • LI registration
        • Logbook requirements
        • Evaluation process
        
        Good luck with your industrial training! 💼
    - text: |
        🎯 **What to Do Next**
        
        1. Find your LI Coordinator's contact
        2. Attend the mandatory LI briefing
        3. Start company hunting early!
        4. Prepare your resume and documents
        
        The LI Coordinator will guide you through registration.
        
        All the best! 🌟

  utter_li_not_yet:
    - text: |
        📅 **Not Yet Eligible**
        
        Based on your current year (**Year {current_year}**), it's a bit early for industrial training.
        
        **Typical LI timing:**
        • Year 3: Some programs allow LI
        • Year 4: Most common LI period
        
        Don't worry - use this time to prepare!
    - text: |
        ⏰ **A Bit Early for LI**
        
        As a Year {current_year} student, you'll typically do LI in Year 3 or 4.
        
        But it's never too early to prepare!

  utter_li_preparation:
    - text: |
        💡 **Prepare for LI Now!**
        
        **What you can do now:**
        
        1. **Build your resume** - Projects, skills, activities
        2. **Learn industry skills** - Programming, tools, soft skills
        3. **Network** - Career fairs, LinkedIn, alumni
        4. **Research companies** - Know where you want to go
        5. **Maintain good CGPA** - Some companies have requirements
        
        The earlier you prepare, the better your placement! 🚀
    - text: |
        🎯 **LI Preparation Tips**
        
        • Start building your portfolio/resume
        • Join relevant clubs or projects
        • Maintain good academic standing
        • Research companies you're interested in
        • Attend career talks and fairs
        
        Preparation = Better opportunities! 💼

  utter_li_not_eligible:
    - text: |
        ⚠️ **Eligibility Issue Detected**
        
        Based on your input, there may be an issue with your LI eligibility.
        
        Let me show you what needs attention...
    - text: |
        📋 **LI Eligibility Check**
        
        It looks like there's something that needs to be addressed before LI.
        
        Here's what I found...

  utter_li_issues:
    - text: |
        📝 **Issues to Address:**
        
        {li_issues}
        
        Would you like guidance on resolving these?
    - text: |
        🎯 **Action Required:**
        
        {li_issues}
        
        Need help with these requirements?

  utter_li_guidance:
    - text: |
        💡 **Guidance for LI Eligibility**
        
        **On Probation?**
        → Focus on improving CGPA first
        → See probation recovery strategies
        → LI may need to wait until clear
        
        **Credits Short?**
        → Complete more courses this semester
        → Check with advisor for alternatives
        
        **Need Help?**
        → Your Academic Advisor can provide a personalized plan
        → LI Coordinator can advise on timing
        
        Don't give up - work on these requirements! 💪
    - text: |
        🎯 **How to Become Eligible**
        
        • Clear probation status (if applicable)
        • Complete required credit hours
        • Consult your advisor for course planning
        
        Your LI Coordinator can also advise on exceptions.

  utter_li_encouragement:
    - text: |
        💪 **Keep Working Toward It!**
        
        Industrial training is a great opportunity, and you'll get there!
        
        Focus on your academics now, and LI will come at the right time.
        
        All the best! 🌟
    - text: |
        🌟 **You'll Get There!**
        
        Every semester brings you closer to LI eligibility.
        
        Keep up the good work! 📚

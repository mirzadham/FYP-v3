# Endpoints Configuration
# Academic Advisor Chatbot - UPM

# Action server endpoint for custom actions
action_endpoint:
  url: "${ACTION_SERVER_URL:-http://localhost:5055/webhook}"

# Tracker store configuration - Cloud SQL PostgreSQL
# For local dev: use docker-compose postgres
# For Cloud Run: use Cloud SQL connection string
# WARNING: Default credentials (rasa/rasa) are for local development only
# NEVER use these credentials in production or internet-accessible environments
tracker_store:
  type: SQL
  dialect: sqlite
  url: "sqlite:///db/rasa_tracker.db"

# Event broker (optional, for production)
# event_broker:
#   type: pika
#   url: localhost

# Model server (optional, for pulling models remotely)
# model:
#   url: http://localhost:5002/

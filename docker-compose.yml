# Docker Compose for Local Development
# Includes PostgreSQL for testing Cloud SQL compatibility

services:


  # Rasa Action Server
  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    ports:
      # Map container port 8080 to host port 5055 for local development
      # Container listens on 8080 (PORT env var), exposed on host at 5055
      - "5055:8080"
    environment:
      - PORT=8080


  # Rasa Server
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5005:8080"
    environment:
      - PORT=8080
      - RASA_LICENSE=${RASA_LICENSE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ACTION_SERVER_URL=http://action-server:8080/webhook
    depends_on:
      action-server:
        condition: service_started

volumes:


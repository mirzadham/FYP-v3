# Deploy Workflow
# Builds and deploys to GCP Cloud Run on merge to main

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  RASA_SERVICE: rasa-server
  ACTIONS_SERVICE: action-server
  REGISTRY: asia-southeast1-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Action Server image
        run: |
          docker build -f Dockerfile.actions -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/actions:${{ github.sha }} .
          docker build -f Dockerfile.actions -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/actions:latest .
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/actions:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/actions:latest

      - name: Build and push Rasa Server image
        run: |
          docker build -f Dockerfile -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/rasa:${{ github.sha }} .
          docker build -f Dockerfile -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/rasa:latest .
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/rasa:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/rasa:latest

      - name: Deploy Action Server to Cloud Run
        run: |
          gcloud run deploy ${{ env.ACTIONS_SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/actions:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2

      - name: Get Action Server URL
        id: action-url
        run: |
          URL=$(gcloud run services describe ${{ env.ACTIONS_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy Rasa Server to Cloud Run
        run: |
          gcloud run deploy ${{ env.RASA_SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/rasa-chatbot/rasa:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=3 \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION }} \
            --set-env-vars="RASA_PRO_LICENSE=${{ secrets.RASA_PRO_LICENSE }}" \
            --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="ACTION_SERVER_URL=${{ steps.action-url.outputs.url }}/webhook"

      - name: Get Rasa Server URL
        run: |
          URL=$(gcloud run services describe ${{ env.RASA_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "🚀 Rasa Server deployed to: $URL"
          echo "📱 Set Telegram webhook: https://api.telegram.org/bot\$TELEGRAM_TOKEN/setWebhook?url=$URL/webhooks/telegram/webhook"

# Rasa Pro CALM Configuration
# Academic Advisor Chatbot - UPM

recipe: default.v1
assistant_id: upm_academic_advisor
language: en

pipeline:
  # Regex-based entity extraction for deterministic course code detection
  # Matches patterns like CCS3101, CSC4600, SKA1020 (3 uppercase letters + 4 digits)
  - name: RegexEntityExtractor
    case_sensitive: false
    patterns:
      - name: course_code
        pattern: "[A-Za-z]{3}\\d{4}"
  
  # LLM-based command generator for CALM architecture
  - name: SingleStepLLMCommandGenerator
    llm:
      model_name: gpt-4o-mini
      # Temperature set low for more deterministic responses
      temperature: 0.2
    # Enable prompt caching for faster responses
    prompt_caching: False

policies:
  # FlowPolicy required for CALM flows
  - name: FlowPolicy

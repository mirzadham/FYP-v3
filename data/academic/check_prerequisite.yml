flows:
  check_prerequisite:
    description: |
      Check prerequisites for a course. This production-grade flow handles:
      - Invalid course code formats
      - Database connectivity issues
      - Courses with/without prerequisites
      - Follow-up requests to check additional courses
    name: check course prerequisites
    steps:
      # Step 1: Collect course code from student
      - id: collect_course_code
        collect: course_code
        description: The course code to check prerequisites for (e.g., CCS3101, CSC4600)
      
      # Step 2: Validate course code format before database lookup
      - action: validate_course_code_format
        next:
          - if: "slots.course_code_valid = false"
            then:
              - action: utter_invalid_course_code_format
              - action: reset_course_code
                next: collect_course_code
          - else: check_prerequisites_action
      
      # Step 3: Check prerequisites in database
      - id: check_prerequisites_action
        action: check_prerequisites
        next:
          - if: "slots.return_value = 'database_error'"
            then:
              - action: utter_database_error
                next: END
          - if: "slots.return_value = 'course_not_found'"
            then:
              - action: utter_course_not_found
                next: offer_another_check
          - if: slots.has_prerequisites
            then:
              - action: utter_prereq_result
              - action: utter_prereq_guidance
                next: offer_another_check
          - else:
              - action: utter_no_prerequisites
                next: offer_another_check
      
      # Step 4: Offer to check another course
      - id: offer_another_check
        collect: wants_another_check
        next:
          - if: slots.wants_another_check
            then:
              - action: reset_course_code
                next: collect_course_code
          - else:
              - action: utter_goodbye_prerequisites
                next: END

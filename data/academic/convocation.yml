flows:
  convocation_info:
    description: |
      Handles queries about graduation ELIGIBILITY only. Focuses on academic requirements for graduation.
      Redirects ceremony logistics (robes, tickets, venue) to Registry/SMP.
      Examples: "am I eligible to graduate?", "graduation requirements", "how many credits to graduate?"
    name: graduation eligibility check
    steps:
      - action: utter_graduation_eligibility

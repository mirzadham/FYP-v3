flows:
  convocation_info:
    description: |
      Handles queries about convocation/graduation. Redirects logistics to SMP and provides academic requirements.
      Examples: "when is convocation?", "how to rent robe", "graduation requirements", "convo tickets", "am I eligible to graduate?"
    name: convocation information
    steps:
      - action: utter_convocation_overview
      - action: utter_convocation_requirements
